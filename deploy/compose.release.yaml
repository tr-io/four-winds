name: four-winds
services:
  game:
    image: ${FOUR_WINDS_IMAGE:?Deploy an immutable image digest}
    restart: unless-stopped
    init: true
    user: '1000:1000'
    environment:
      NODE_ENV: production
      ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN}
      # Port 3001 is private; Caddy overwrites X-Forwarded-For.
      TRUST_PROXY: '1'
      DATA_FILE: /app/data/four-winds.json
    volumes:
      - game-data:/app/data
    expose: ['3001']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: local
      options: { max-size: '10m', max-file: '3' }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - /etc/four-winds/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    cap_add: ['NET_BIND_SERVICE']
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: local
      options: { max-size: '10m', max-file: '3' }
volumes:
  game-data:
  caddy-data:
  caddy-config:
