name: Check game
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run avatars:check
      - run: npm test
      - run: npm run test:deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:mobile
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-details
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate release Compose
        env:
          DOMAIN: mahjong.example.com
          ACME_EMAIL: admin@example.com
          FOUR_WINDS_IMAGE: ghcr.io/tr-io/four-winds@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose -f deploy/compose.release.yaml config --quiet
